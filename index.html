<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daycount">
<meta name="theme-color" content="#F6F5F2">
<title>Daycount</title>
<style>
:root{
  --bg:#F6F5F2; --card:#FFFFFF; --text:#1C1C1E; --muted:#76767C; --line:#E6E4DF;
  --accent:#2F4A5A; --accent-soft:#E7ECEF; --rest:#5E7A6B;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121214; --card:#1C1C1F; --text:#F2F2F4; --muted:#9A9AA2; --line:#2C2C30;
    --accent:#9DB7C6; --accent-soft:#24303A; --rest:#A7C2B3; }
}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);
  padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 24px);-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-size:15px;font-weight:600;letter-spacing:.02em}
.link{background:none;border:0;color:var(--accent);font-size:15px;padding:8px 0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:12px}
.label{font-size:13px;color:var(--muted)}
.big{font-size:72px;font-weight:600;line-height:1;margin:14px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.suf{font-size:20px;font-weight:500;margin-left:6px;color:var(--muted);letter-spacing:0}
.phase{font-size:16px;font-weight:600}
.phase.active{color:var(--accent)} .phase.rest{color:var(--rest)}
.meta{display:flex;gap:24px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.meta b{display:block;color:var(--text);font-weight:600;font-size:15px;margin-top:3px}
.meta:empty{display:none}
.bar{height:6px;background:var(--accent-soft);border-radius:3px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}
.btn{width:100%;padding:15px;border-radius:12px;font-size:16px;font-weight:600;border:1px solid var(--line);
  background:var(--card);color:var(--text);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#121214}}
.seg{display:flex;background:var(--accent-soft);border-radius:10px;padding:3px;margin:8px 0 4px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row input{font-size:16px;border:0;background:none;color:var(--text);text-align:right;font-family:inherit}
.row input[type=number]{width:60px}
.unit{color:var(--muted);font-size:14px;margin-left:4px}
.section{font-size:13px;color:var(--muted);margin:20px 4px 8px}
.list{padding:8px 20px}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Daycount</div>
    <button class="link" id="toggle" onclick="toggleView()">設定</button>
  </header>

  <main id="home">
    <div class="card">
      <div class="label" id="today"></div>
      <div class="big" id="num">–</div>
      <div class="phase" id="phase"></div>
      <div id="barWrap" class="hidden">
        <div class="bar"><i id="bar"></i></div>
        <div class="note" id="barNote"></div>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <button class="btn" id="action" onclick="act()"></button>
  </main>

  <section id="settings" class="hidden">
    <div class="section">服用のしかた</div>
    <div class="card list">
      <div class="seg">
        <button data-m="flex" onclick="setMode('flex')">連続服用</button>
        <button data-m="cycle" onclick="setMode('cycle')">周期どおり</button>
      </div>
      <p class="note" id="modeNote" style="margin:4px 0 8px"></p>
      <div class="row"><span id="startLabel"></span><input type="date" id="f-start"></div>
      <div class="row cyc"><span>服薬日数</span><span><input type="number" id="f-active" min="1" max="120" inputmode="numeric"><span class="unit">日</span></span></div>
      <div class="row"><span>休薬日数</span><span><input type="number" id="f-rest" min="0" max="14" inputmode="numeric"><span class="unit">日</span></span></div>
      <div class="row flx"><span>連続日数の上限の目安</span><span><input type="number" id="f-limit" min="0" max="365" inputmode="numeric"><span class="unit">日</span></span></div>
    </div>
    <p class="note" style="margin:0 4px">日数は処方内容や添付文書に合わせて設定してください。上限は0にすると表示しません。</p>

    <div class="section">通知</div>
    <div class="card list">
      <div class="row"><span>通知時刻</span><input type="time" id="f-time"></div>
    </div>
    <p class="note" style="margin:0 4px 20px">通知の配信は次のアップデートで有効になります。</p>
    <button class="btn primary" onclick="saveSettings()">保存</button>
  </section>
</div>

<script>
const DAY = 86400000, KEY = 'daycount';
const DEF = { mode:'flex', start:'', active:21, rest:4, limit:120, time:'21:00' };
const $ = id => document.getElementById(id);
let s = load(), mode = s.mode, inSettings = false;

function load(){
  const v = localStorage.getItem(KEY);
  if (v) return { ...DEF, ...JSON.parse(v) };
  const old = localStorage.getItem('start'); // 旧バージョンのデータを引き継ぐ
  return old ? { ...DEF, start: old } : { ...DEF };
}
function store(){ localStorage.setItem(KEY, JSON.stringify(s)); }
function today(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function parse(str){ return new Date(str + 'T00:00'); }
function ymd(d){ return d.toLocaleDateString('sv-SE'); }
function md(d){ return `${d.getMonth()+1}/${d.getDate()}`; }
function addDays(d, n){ return new Date(d.getTime() + n * DAY); }
function between(a, b){ return Math.round((b - a) / DAY); }

function show(n, label, cls){
  $('num').innerHTML = n === null ? '–' : `${n}<span class="suf">日目</span>`;
  $('phase').textContent = label;
  $('phase').className = 'phase ' + cls;
}
function setMeta(items){
  $('meta').innerHTML = items.map(([k, v]) => `<div>${k}<b>${v}</b></div>`).join('');
}

function render(){
  const t = today();
  $('today').textContent = `${t.getMonth()+1}月${t.getDate()}日（${'日月火水木金土'[t.getDay()]}）`;
  $('barWrap').classList.add('hidden');
  const action = $('action');

  if (!s.start){
    show(null, '設定から開始日を入力してください', '');
    setMeta([]); action.classList.add('hidden'); return;
  }
  const start = parse(s.start), diff = between(start, t);

  if (s.mode === 'flex'){
    action.classList.remove('hidden');
    if (diff >= 0){
      const n = diff + 1;
      show(n, '連続服薬', 'active');
      setMeta([['開始', md(start)]]);
      if (s.limit > 0){
        $('barWrap').classList.remove('hidden');
        $('bar').style.width = Math.min(100, n / s.limit * 100) + '%';
        const left = s.limit - n;
        $('barNote').textContent = left > 0 ? `上限の目安まで あと${left}日` : '上限の目安に達しています';
      }
      action.textContent = '今日から休薬する';
    } else {
      show(diff + s.rest + 1, '休薬', 'rest');
      setMeta([['服薬再開', md(start)], ['休薬期間', `${s.rest}日間`]]);
      action.textContent = '今日から服薬を再開する';
    }
  } else {
    action.classList.add('hidden');
    if (diff < 0){
      show(null, `${md(start)}から開始`, ''); setMeta([]); return;
    }
    const cyc = s.active + s.rest, d = diff % cyc, round = Math.floor(diff / cyc) + 1;
    if (d < s.active){
      show(d + 1, '服薬', 'active');
      setMeta([['周期', `${round}周目`], [s.rest > 0 ? '休薬開始' : '次の周期', md(addDays(t, s.active - d))]]);
    } else {
      show(d - s.active + 1, '休薬', 'rest');
      setMeta([['周期', `${round}周目`], ['服薬再開', md(addDays(t, cyc - d))]]);
    }
  }
}

function act(){
  const t = today();
  if (between(parse(s.start), t) >= 0){
    if (!confirm(`今日から${s.rest}日間 休薬しますか？`)) return;
    s.start = ymd(addDays(t, s.rest));
  } else {
    if (!confirm('今日から服薬を再開しますか？')) return;
    s.start = ymd(t);
  }
  store(); render();
}

function setMode(m){
  mode = m;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  document.querySelectorAll('.cyc').forEach(e => e.classList.toggle('hidden', m !== 'cycle'));
  document.querySelectorAll('.flx').forEach(e => e.classList.toggle('hidden', m !== 'flex'));
  $('startLabel').textContent = m === 'flex' ? '連続服薬の開始日' : '1周期目の開始日';
  $('modeNote').textContent = m === 'flex'
    ? '好きなタイミングで休薬するタイプ。休薬すると日数がリセットされます。'
    : '決まった日数で服薬と休薬をくり返すタイプ。';
}
function fill(){
  $('f-start').value = s.start; $('f-active').value = s.active; $('f-rest').value = s.rest;
  $('f-limit').value = s.limit; $('f-time').value = s.time;
  setMode(s.mode);
}
function num(id, min, max, def){
  const v = parseInt($(id).value, 10);
  return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : def;
}
function saveSettings(){
  s = { ...s, mode, start: $('f-start').value,
    active: num('f-active', 1, 120, 21), rest: num('f-rest', 0, 14, 4),
    limit: num('f-limit', 0, 365, 0),
    time: $('f-time').value || '21:00' };
  store(); toggleView(false);
}
function toggleView(open = !inSettings){
  inSettings = open;
  $('home').classList.toggle('hidden', open);
  $('settings').classList.toggle('hidden', !open);
  $('toggle').textContent = open ? '閉じる' : '設定';
  open ? fill() : render();
}

s.start ? render() : toggleView(true);
</script>
</body>
</html>
