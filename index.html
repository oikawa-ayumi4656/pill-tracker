<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daycount">
<meta name="theme-color" content="#EDF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A1A" media="(prefers-color-scheme: dark)">
<title>Daycount</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --tint:#F3F6F5; --ink:#1D2928; --muted:#6C7B79; --line:#E1E7E6;
  --accent:#2C7A72; --accent-2:#6FB3A8; --accent-soft:#DDEDEA;
  --rest:#7569A0; --rest-soft:#E9E5F3;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(29,41,40,.04), 0 18px 40px -18px rgba(29,41,40,.18);
  color-scheme:light dark;
  --font:"Manrope","Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121A1A; --surface:#1A2423; --tint:#222E2D; --ink:#E9EFEE; --muted:#93A3A1; --line:#2A3635;
    --accent:#7FC7BB; --accent-2:#4E9A8F; --accent-soft:#1F3532;
    --rest:#B6ACDB; --rest-soft:#2A2840;
    --on-accent:#0F1716;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 18px 40px -18px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 28px);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:440px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-size:18px;font-weight:800;letter-spacing:-.02em}
.link{border:0;background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;
  padding:9px 16px;border-radius:999px;box-shadow:0 1px 2px rgba(29,41,40,.06)}

/* home */
.hero{background:var(--surface);border-radius:28px;padding:22px 24px 24px;box-shadow:var(--shadow);margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.label{font-size:14px;color:var(--muted);font-weight:500}
.phase{font-size:14px;color:var(--muted);font-weight:500}
.phase.active,.phase.rest{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;
  border-radius:999px;font-weight:700;font-size:13px}
.phase.active::before,.phase.rest::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.phase.active{background:var(--accent-soft);color:var(--accent)}
.phase.rest{background:var(--rest-soft);color:var(--rest)}
.big{font-size:112px;font-weight:800;line-height:.9;margin:22px 0 4px -4px;letter-spacing:-.055em;
  font-variant-numeric:proportional-nums;display:flex;align-items:baseline}
.suf{font-size:22px;font-weight:700;margin-left:12px;color:var(--muted);letter-spacing:0}
.bar{height:10px;background:var(--tint);border-radius:999px;overflow:hidden;margin-top:22px}
.bar i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.7}
#barNote{font-weight:500}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.meta div{background:var(--tint);border-radius:16px;padding:12px 14px;font-size:12px;color:var(--muted);font-weight:500}
.meta b{display:block;color:var(--ink);font-weight:700;font-size:18px;margin-top:2px;letter-spacing:-.01em}
.meta:empty{display:none}

.btn{width:100%;min-height:56px;padding:15px;border-radius:999px;font-size:16px;font-weight:700;border:0;
  background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(29,41,40,.06);
  transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 24px -12px var(--accent)}

/* settings */
.section{font-size:13px;font-weight:700;color:var(--muted);margin:22px 6px 10px}
.section:first-child{margin-top:4px}
.list{background:var(--surface);border-radius:22px;padding:6px 18px}
.seg{position:relative;display:flex;background:var(--tint);border-radius:999px;padding:4px;margin:12px 0 6px}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;
  background:var(--surface);box-shadow:0 1px 3px rgba(29,41,40,.12);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.seg[data-m="cycle"]::before{transform:translateX(100%)}
.seg button{position:relative;flex:1;border:0;background:none;padding:10px;border-radius:999px;font-size:14px;
  font-weight:600;color:var(--muted);transition:color .2s}
.seg button.on{color:var(--ink);font-weight:700}
#modeNote{margin:4px 2px 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px;padding:8px 0;
  font-size:15px;font-weight:500}
.row + .row{border-top:1px solid var(--line)}
.row > span:first-child{min-width:0}
.field{display:flex;align-items:center;flex-shrink:0}
.row input{font:inherit;font-size:16px;font-weight:700;border:0;background:var(--tint);color:var(--ink);
  border-radius:12px;padding:8px 12px;text-align:right;min-width:0;-webkit-appearance:none;appearance:none;
  font-variant-numeric:tabular-nums}
.row input[type=number]{width:68px;-moz-appearance:textfield}
.row input::-webkit-inner-spin-button,.row input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.row input[type=date],.row input[type=time]{min-height:40px;max-width:60%}
.row input::-webkit-date-and-time-value{text-align:right}
.unit{color:var(--muted);font-size:14px;margin-left:8px}
.hint{font-size:13px;color:var(--muted);line-height:1.7;margin:10px 6px 0}
#saveBtn{margin-top:26px}

/* today's record */
.take{margin-bottom:14px}
.taken{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.taken.pop{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
.check{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center}
.check svg{width:20px;height:20px}
.taken div{flex:1;min-width:0}
.taken strong{display:block;font-size:16px;font-weight:700}
.taken small{display:block;font-size:13px;color:var(--muted);margin-top:2px;font-weight:500}
.text-btn{border:0;background:none;color:var(--accent);font-size:14px;font-weight:700;padding:8px 4px}

/* history */
.panel{background:var(--surface);border-radius:22px;padding:18px 16px 16px;margin-bottom:14px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px;min-height:36px}
.panel-head h2{font-size:15px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px;text-align:center}
.wd{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.d{border:0;background:none;padding:2px 0 4px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.d:disabled{cursor:default}
.d.is-today{color:var(--ink);font-weight:800}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;transition:background .2s,box-shadow .2s}
.dot svg{width:16px;height:16px}
.dot.on{background:var(--accent);color:var(--on-accent)}
.dot.off{box-shadow:inset 0 0 0 1.5px var(--line)}
.dot.rest{background:var(--rest-soft)}
.dot.none{background:var(--tint);opacity:.5}
.d.is-today .dot.off{box-shadow:inset 0 0 0 2px var(--accent)}
.legend{display:flex;gap:16px;margin:14px 4px 0;font-size:12px;color:var(--muted);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}
.legend .on{background:var(--accent)} .legend .off{box-shadow:inset 0 0 0 1.5px var(--muted)} .legend .rest{background:var(--rest-soft);box-shadow:inset 0 0 0 1px var(--rest)}
.panel .hint{margin:10px 4px 0}
.hidden{display:none !important}

@media (prefers-reduced-motion: reduce){
  .bar i,.seg::before,.btn,.seg button,.dot{transition:none}
  .taken.pop{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Daycount</div>
    <button class="link" id="toggle" onclick="toggleView()">設定</button>
  </header>

  <main id="home">
    <div class="hero">
      <div class="top">
        <div class="phase" id="phase"></div>
        <div class="label" id="today"></div>
      </div>
      <div class="big" id="num">–</div>
      <div id="barWrap" class="hidden">
        <div class="bar"><i id="bar"></i></div>
        <div class="note" id="barNote"></div>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <button class="btn primary take hidden" id="takeBtn" onclick="take()">飲んだ</button>
    <div class="taken hidden" id="takenBox">
      <span class="check" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10.5l3.2 3.2L15 6.5"/></svg></span>
      <div><strong>今日は飲みました</strong><small id="takenAt"></small></div>
      <button class="text-btn" onclick="untake()">取り消す</button>
    </div>

    <section class="panel hidden" id="history">
      <div class="panel-head">
        <h2>服薬の記録</h2>
        <button class="text-btn hidden" id="moreBtn" onclick="showAll = !showAll; renderHistory(today())">すべて表示</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i class="on"></i>飲んだ</span><span><i class="off"></i>飲んでいない</span><span><i class="rest"></i>休薬</span></div>
      <p class="hint">過去の服薬日はタップして修正できます。</p>
    </section>

    <button class="btn" id="action" onclick="act()"></button>
  </main>

  <section id="settings" class="hidden">
    <div class="section">服用のしかた</div>
    <div class="list">
      <div class="seg" id="seg">
        <button data-m="flex" onclick="setMode('flex')">連続服用</button>
        <button data-m="cycle" onclick="setMode('cycle')">周期どおり</button>
      </div>
      <p class="note" id="modeNote"></p>
      <div class="row"><span id="startLabel"></span><input type="date" id="f-start"></div>
      <div class="row cyc"><span>服薬日数</span><span class="field"><input type="number" id="f-active" min="1" max="120" inputmode="numeric"><span class="unit">日</span></span></div>
      <div class="row"><span>休薬日数</span><span class="field"><input type="number" id="f-rest" min="0" max="14" inputmode="numeric"><span class="unit">日</span></span></div>
      <div class="row flx"><span>連続日数の上限の目安</span><span class="field"><input type="number" id="f-limit" min="0" max="365" inputmode="numeric"><span class="unit">日</span></span></div>
    </div>
    <p class="hint">日数は処方内容や添付文書に合わせて設定してください。上限は0にすると表示しません。</p>

    <div class="section">通知</div>
    <div class="list">
      <div class="row"><span>通知時刻</span><input type="time" id="f-time"></div>
    </div>
    <p class="hint">通知の配信は次のアップデートで有効になります。</p>
    <button class="btn primary" id="saveBtn" onclick="saveSettings()">保存</button>
  </section>
</div>

<script>
const DAY = 86400000, KEY = 'daycount';
const DEF = { mode:'flex', start:'', active:21, rest:4, limit:120, time:'21:00' };
const $ = id => document.getElementById(id);
let s = load(), mode = s.mode, inSettings = false;
let taken = loadTaken(), showAll = false;

function load(){
  const v = localStorage.getItem(KEY);
  if (v) return { ...DEF, ...JSON.parse(v) };
  const old = localStorage.getItem('start'); // 旧バージョンのデータを引き継ぐ
  return old ? { ...DEF, start: old } : { ...DEF };
}
function store(){ localStorage.setItem(KEY, JSON.stringify(s)); }

// 服薬の記録 { 'YYYY-MM-DD': '21:03' | '後から記録' }。旧バージョンと同じキーを使う
function loadTaken(){
  let t = {};
  try { t = JSON.parse(localStorage.getItem('taken') || '{}') || {}; } catch (e) {}
  const cutoff = ymd(addDays(today(), -400)); // 古い記録は整理する
  let pruned = false;
  for (const k in t) if (k < cutoff){ delete t[k]; pruned = true; }
  if (pruned) localStorage.setItem('taken', JSON.stringify(t));
  return t;
}
function storeTaken(){ localStorage.setItem('taken', JSON.stringify(taken)); }
function today(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function parse(str){ return new Date(str + 'T00:00'); }
function ymd(d){ return d.toLocaleDateString('sv-SE'); }
function md(d){ return `${d.getMonth()+1}/${d.getDate()}`; }
function addDays(d, n){ return new Date(d.getTime() + n * DAY); }
function between(a, b){ return Math.round((b - a) / DAY); }

const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let intro = !calm; // 起動時だけ数字をカウントアップする

function show(n, label, cls){
  const el = $('num');
  $('phase').textContent = label;
  $('phase').className = 'phase ' + cls;
  if (n === null){ el.textContent = '–'; return; }
  el.innerHTML = `<span id="n">${n}</span><span class="suf">日目</span>`;
  if (intro && n > 1){
    const node = $('n'), t0 = performance.now(), dur = Math.min(900, 300 + n * 12);
    const step = now => {
      if (!node.isConnected) return; // 途中で再描画されたら止める
      const p = Math.min(1, Math.max(0, now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      node.textContent = Math.max(1, Math.round(n * e));
      if (p < 1) requestAnimationFrame(step);
    };
    node.textContent = 1;
    requestAnimationFrame(step);
  }
}
function setBar(pct){
  const bar = $('bar');
  if (intro){ bar.style.width = '0%'; requestAnimationFrame(() => requestAnimationFrame(() => bar.style.width = pct + '%')); }
  else bar.style.width = pct + '%';
}
function setMeta(items){
  $('meta').innerHTML = items.map(([k, v]) => `<div>${k}<b>${v}</b></div>`).join('');
}

// その日が服薬日か休薬日か（開始前や不明は null）
function phaseOf(d){
  if (!s.start) return null;
  const diff = between(parse(s.start), d);
  if (s.mode === 'flex') return diff >= 0 ? 'active' : diff >= -s.rest ? 'rest' : null;
  if (diff < 0) return null;
  return diff % (s.active + s.rest) < s.active ? 'active' : 'rest';
}
// 今の服薬期間に入って何日目か（休薬中・開始前は 0）
function runLength(t){
  if (phaseOf(t) !== 'active') return 0;
  const diff = between(parse(s.start), t);
  return s.mode === 'flex' ? diff + 1 : diff % (s.active + s.rest) + 1;
}

const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.4l2.6 2.6L12 5.4"/></svg>';

function renderRecord(t){
  const key = ymd(t), active = phaseOf(t) === 'active', done = !!taken[key];
  $('takeBtn').classList.toggle('hidden', !active || done);
  $('takenBox').classList.toggle('hidden', !active || !done);
  $('takenAt').textContent = done ? (taken[key].includes(':') ? `${taken[key]}に記録` : '後から記録') : '';
  renderHistory(t);
}
function renderHistory(t){
  const run = runLength(t);
  $('history').classList.toggle('hidden', !s.start);
  if (!s.start) return;
  $('moreBtn').classList.toggle('hidden', run <= 14);
  $('moreBtn').textContent = showAll ? '直近だけ表示' : 'すべて表示';
  const span = showAll ? Math.max(14, run) : 14;
  const first = addDays(t, -(span - 1));
  let html = [...'日月火水木金土'].map(w => `<div class="wd">${w}</div>`).join('');
  html += '<div></div>'.repeat(first.getDay());
  for (let i = span - 1; i >= 0; i--){
    const d = addDays(t, -i), k = ymd(d), ph = phaseOf(d), on = !!taken[k];
    const cls = on ? 'on' : ph === 'rest' ? 'rest' : ph === 'active' ? 'off' : 'none';
    const state = on ? '飲んだ' : ph === 'rest' ? '休薬' : ph === 'active' ? '飲んでいない' : '記録なし';
    html += `<button class="d${i === 0 ? ' is-today' : ''}" data-k="${k}" ${ph === 'active' ? '' : 'disabled'}`
      + ` aria-label="${d.getMonth()+1}月${d.getDate()}日 ${state}" onclick="toggleDay('${k}', ${i === 0})">`
      + `<span class="dot ${cls}">${on ? CHECK : ''}</span>${i === 0 ? '今日' : d.getDate()}</button>`;
  }
  $('grid').innerHTML = html;
}
function now(){ return new Date().toTimeString().slice(0, 5); }
function take(){
  taken[ymd(today())] = now(); storeTaken(); renderRecord(today());
  const box = $('takenBox'); box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
}
function untake(){ delete taken[ymd(today())]; storeTaken(); renderRecord(today()); }
function toggleDay(k, isToday){
  if (taken[k]) delete taken[k]; else taken[k] = isToday ? now() : '後から記録';
  storeTaken(); renderRecord(today());
}

function render(){
  const t = today();
  renderRecord(t);
  $('today').textContent = `${t.getMonth()+1}月${t.getDate()}日（${'日月火水木金土'[t.getDay()]}）`;
  $('barWrap').classList.add('hidden');
  const action = $('action');

  if (!s.start){
    show(null, '設定から開始日を入力してください', '');
    setMeta([]); action.classList.add('hidden'); return;
  }
  const start = parse(s.start), diff = between(start, t);

  if (s.mode === 'flex'){
    action.classList.remove('hidden');
    if (diff >= 0){
      const n = diff + 1;
      show(n, '連続服薬', 'active');
      setMeta([['開始', md(start)]]);
      if (s.limit > 0){
        $('barWrap').classList.remove('hidden');
        setBar(Math.min(100, n / s.limit * 100));
        const left = s.limit - n;
        $('barNote').textContent = left > 0 ? `上限の目安まで あと${left}日` : '上限の目安に達しています';
      }
      action.textContent = '今日から休薬する';
    } else {
      show(diff + s.rest + 1, '休薬', 'rest');
      setMeta([['服薬再開', md(start)], ['休薬期間', `${s.rest}日間`]]);
      action.textContent = '今日から服薬を再開する';
    }
  } else {
    action.classList.add('hidden');
    if (diff < 0){
      show(null, `${md(start)}から開始`, ''); setMeta([]); return;
    }
    const cyc = s.active + s.rest, d = diff % cyc, round = Math.floor(diff / cyc) + 1;
    if (d < s.active){
      show(d + 1, '服薬', 'active');
      setMeta([['周期', `${round}周目`], [s.rest > 0 ? '休薬開始' : '次の周期', md(addDays(t, s.active - d))]]);
    } else {
      show(d - s.active + 1, '休薬', 'rest');
      setMeta([['周期', `${round}周目`], ['服薬再開', md(addDays(t, cyc - d))]]);
    }
  }
}

function act(){
  const t = today();
  if (between(parse(s.start), t) >= 0){
    if (!confirm(`今日から${s.rest}日間 休薬しますか？`)) return;
    s.start = ymd(addDays(t, s.rest));
  } else {
    if (!confirm('今日から服薬を再開しますか？')) return;
    s.start = ymd(t);
  }
  store(); render();
}

function setMode(m){
  mode = m;
  $('seg').dataset.m = m;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  document.querySelectorAll('.cyc').forEach(e => e.classList.toggle('hidden', m !== 'cycle'));
  document.querySelectorAll('.flx').forEach(e => e.classList.toggle('hidden', m !== 'flex'));
  $('startLabel').textContent = m === 'flex' ? '連続服薬の開始日' : '1周期目の開始日';
  $('modeNote').textContent = m === 'flex'
    ? '好きなタイミングで休薬するタイプ。休薬すると日数がリセットされます。'
    : '決まった日数で服薬と休薬をくり返すタイプ。';
}
function fill(){
  $('f-start').value = s.start; $('f-active').value = s.active; $('f-rest').value = s.rest;
  $('f-limit').value = s.limit; $('f-time').value = s.time;
  setMode(s.mode);
}
function num(id, min, max, def){
  const v = parseInt($(id).value, 10);
  return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : def;
}
function saveSettings(){
  s = { ...s, mode, start: $('f-start').value,
    active: num('f-active', 1, 120, 21), rest: num('f-rest', 0, 14, 4),
    limit: num('f-limit', 0, 365, 0),
    time: $('f-time').value || '21:00' };
  store(); toggleView(false);
}
function toggleView(open = !inSettings){
  inSettings = open;
  $('home').classList.toggle('hidden', open);
  $('settings').classList.toggle('hidden', !open);
  $('toggle').textContent = open ? '閉じる' : '設定';
  open ? fill() : render();
}

s.start ? render() : toggleView(true);
intro = false;
</script>
</body>
